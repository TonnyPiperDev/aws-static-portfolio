<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" fill="#0D0D0D"/>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" font-size="13" fill="#C9A84C" font-weight="500" letter-spacing="1">tonnypiper.dev — Project 02 Architecture</text>

  <!-- User — grey -->
  <rect x="30" y="155" width="100" height="56" rx="8" fill="#2C2C2A" stroke="#4A4A46" stroke-width="1"/>
  <text x="80" y="178" text-anchor="middle" font-size="13" fill="#D3D1C7" font-weight="500">User</text>
  <text x="80" y="196" text-anchor="middle" font-size="11" fill="#888780">Browser</text>

  <!-- Arrow: User → Cloudflare -->
  <line x1="130" y1="183" x2="175" y2="183" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Cloudflare — amber/orange -->
  <rect x="177" y="155" width="110" height="56" rx="8" fill="#412402" stroke="#BA7517" stroke-width="1"/>
  <text x="232" y="178" text-anchor="middle" font-size="13" fill="#FAC775" font-weight="500">Cloudflare</text>
  <text x="232" y="196" text-anchor="middle" font-size="11" fill="#EF9F27">DNS only</text>

  <!-- Arrow: Cloudflare → CloudFront -->
  <line x1="287" y1="183" x2="332" y2="183" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CloudFront — purple -->
  <rect x="334" y="130" width="130" height="106" rx="8" fill="#26215C" stroke="#7F77DD" stroke-width="1"/>
  <text x="399" y="158" text-anchor="middle" font-size="13" fill="#CECBF6" font-weight="500">CloudFront</text>
  <text x="399" y="176" text-anchor="middle" font-size="11" fill="#AFA9EC">CDN · HTTPS</text>
  <text x="399" y="194" text-anchor="middle" font-size="11" fill="#AFA9EC">Global edge</text>
  <text x="399" y="212" text-anchor="middle" font-size="11" fill="#AFA9EC">redirect-to-https</text>

  <!-- Arrow: CloudFront → S3 with OAC label -->
  <line x1="464" y1="183" x2="508" y2="183" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="486" y="173" text-anchor="middle" font-size="10" fill="#C9A84C">OAC</text>

  <!-- S3 — teal -->
  <rect x="510" y="155" width="130" height="56" rx="8" fill="#04342C" stroke="#1D9E75" stroke-width="1"/>
  <text x="575" y="178" text-anchor="middle" font-size="13" fill="#9FE1CB" font-weight="500">S3 Bucket</text>
  <text x="575" y="196" text-anchor="middle" font-size="11" fill="#5DCAA5">eu-central-1 · Private</text>

  <!-- ACM — coral/red -->
  <rect x="334" y="295" width="130" height="56" rx="8" fill="#4A1B0C" stroke="#D85A30" stroke-width="1"/>
  <text x="399" y="318" text-anchor="middle" font-size="13" fill="#F0997B" font-weight="500">ACM Certificate</text>
  <text x="399" y="336" text-anchor="middle" font-size="11" fill="#D85A30">us-east-1</text>

  <!-- Dashed line: ACM → CloudFront -->
  <line x1="399" y1="295" x2="399" y2="236" stroke="#555" stroke-width="0.8" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)"/>
  <text x="412" y="270" font-size="10" fill="#888">TLS cert</text>

  <!-- Legend -->
  <rect x="30" y="340" width="8" height="8" rx="1" fill="#2C2C2A" stroke="#4A4A46"/>
  <text x="44" y="349" font-size="11" fill="#888">Client</text>

  <rect x="90" y="340" width="8" height="8" rx="1" fill="#412402" stroke="#BA7517"/>
  <text x="104" y="349" font-size="11" fill="#888">DNS</text>

  <rect x="140" y="340" width="8" height="8" rx="1" fill="#26215C" stroke="#7F77DD"/>
  <text x="154" y="349" font-size="11" fill="#888">CDN</text>

  <rect x="195" y="340" width="8" height="8" rx="1" fill="#04342C" stroke="#1D9E75"/>
  <text x="209" y="349" font-size="11" fill="#888">Storage</text>

  <rect x="260" y="340" width="8" height="8" rx="1" fill="#4A1B0C" stroke="#D85A30"/>
  <text x="274" y="349" font-size="11" fill="#888">Certificate</text>

</svg>
