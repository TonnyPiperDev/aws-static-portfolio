<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — Tonny Piper</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root { --gold: #C9A84C; --bg: #0D0D0D; --white: #F5F0E8; --muted: rgba(245,240,232,0.5); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--white); font-family: 'DM Sans', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .code { font-family: 'Playfair Display', serif; font-size: 6rem; color: var(--gold); line-height: 1; }
    .message { margin-top: 1rem; font-size: 1rem; color: var(--muted); font-weight: 300; }
    .link { margin-top: 2rem; }
    .link a { color: var(--gold); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; border-bottom: 1px solid rgba(201,168,76,0.3); padding-bottom: 2px; }
    .link a:hover { border-color: var(--gold); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <p class="message">This page doesn't exist.</p>
  <div class="link"><a href="/">Back to home</a></div>
</body>
</html>
